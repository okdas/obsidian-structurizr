name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install Graphviz and Structurizr CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz unzip
          curl -fsSL https://github.com/structurizr/cli/releases/download/v2025.11.09/structurizr-cli.zip -o /tmp/structurizr-cli.zip
          sudo unzip -q /tmp/structurizr-cli.zip -d /opt/structurizr-cli
          sudo chmod +x /opt/structurizr-cli/structurizr.sh
          echo "STRUCTURIZR_CLI=/opt/structurizr-cli/structurizr.sh" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx tsc --noEmit --target ES2020 --module commonjs --moduleResolution node --skipLibCheck main.ts
      - run: npm test
      - name: Confirm tag matches plugin version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          test "$VERSION" = "$GITHUB_REF_NAME"
      - run: npm run build:release
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp main.js manifest.json styles.css installable/structurizr-diagrams.zip release-assets/
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" --generate-notes
